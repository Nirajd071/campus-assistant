version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: campus_postgres
    environment:
      POSTGRES_DB: appdb
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: 6XHkq66NFRww7Jmqcl+34khpkBH2Gq7i
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./database/sample_data.sql:/docker-entrypoint-initdb.d/02-sample_data.sql
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U appuser -d appdb"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - campus_network

  # Redis Cache & Sessions
  redis:
    image: redis:7-alpine
    container_name: campus_redis
    command: redis-server --requirepass 5yyvbjEjEcyBd9lPNPNKYMqX9nldQHqY
    volumes:
      - redis_data:/data
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    networks:
      - campus_network

  # NLP Engine (Python FastAPI)
  nlp-engine:
    build:
      context: ../🧠 nlp-engine
      dockerfile: Dockerfile
    container_name: campus_nlp
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=5yyvbjEjEcyBd9lPNPNKYMqX9nldQHqY
      - LOG_LEVEL=info
      - OPENAI_API_KEY=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
      - OPENAI_BASE_URL=https://integrate.api.nvidia.com/v1
      - OPENAI_MODEL=openai/gpt-oss-120b
      - GEMINI_API_KEY=AIzaSyAis-7KpOxVZ2eW8ff30CALJwZ0wIpTyTg
      - UNIVERSITY_API_BASE=https://your-university-api.edu/api/v1
      - UNIVERSITY_API_KEY=your_university_api_key_here
      - NLLB_TRANSLATOR_URL=http://nllb-translator:8002
    ports:
      - "8001:8001"
    depends_on:
      redis:
        condition: service_healthy
      nllb-translator:
        condition: service_started
    volumes:
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    networks:
      - campus_network

  # Backend API (Node.js Express)
  backend-api:
    build:
      context: ../🔧 backend-api
      dockerfile: Dockerfile
    container_name: campus_backend
    environment:
      - NODE_ENV=production
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=appdb
      - DB_USER=appuser
      - DB_PASSWORD=6XHkq66NFRww7Jmqcl+34khpkBH2Gq7i
      - REDIS_URL=redis://redis:6379
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=5yyvbjEjEcyBd9lPNPNKYMqX9nldQHqY
      - JWT_SECRET=a5yUMIe6Y3ehDz2wep1XSyRxRE/ezfblr8rZu0Hu8w4=
      - SESSION_SECRET=VRlUgPBnu/q2fV6PYqXMZppr72XaF8Hk
      - NLP_API_URL=http://nlp-engine:8001
    ports:
      - "3007:3007"
    depends_on:
      - postgres
      - redis
      - nlp-engine
    volumes:
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3007/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    networks:
      - campus_network

  # Frontend (React Chat Interface) - Serve static files
  frontend:
    image: nginx:alpine
    container_name: campus_frontend
    volumes:
      - ../🌐 frontend:/usr/share/nginx/html
      - ../🌐 frontend/nginx.conf:/etc/nginx/conf.d/default.conf
    ports:
      - "3008:3008"
    depends_on:
      - backend-api
    restart: unless-stopped
    networks:
      - campus_network


  # Telegram Bot
  telegram-bot:
    build:
      context: ../🤖 telegram-bot
    container_name: campus_telegram_bot
    env_file:
      - ../.env
    environment:
      - NODE_ENV=production
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - NLP_API_URL=http://nlp-engine:8001
      - WEBHOOK_URL=${TELEGRAM_WEBHOOK_URL}
    depends_on:
      - nlp-engine
    restart: unless-stopped
    networks:
      - campus_network

  nllb-translator:
    build:
      context: ../🌐 nllb-translator
      dockerfile: Dockerfile
    container_name: campus_nllb_translator
    ports:
      - "8002:8002"
    restart: unless-stopped
    networks:
      - campus_network
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 2G

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  campus_network:
    driver: bridge
